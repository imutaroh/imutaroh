name: log

# README 上部の「( 00 / log )」画像を 1 日 1 回作り直す。
# 数字が変わっていなければコミットしない。

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 画像を作り直す
        run: CHROME=google-chrome python3 scripts/log.py

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "変化なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/log.json assets/log-light.png assets/log-dark.png
          git commit -m "log: コントリビューションの表示を更新"
          git push
